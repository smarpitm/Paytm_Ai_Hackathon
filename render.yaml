services:
  # 1. FastAPI Backend API & WebSocket Service
  - type: web
    name: voicevyapar-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MERCHANT_NAME
        value: Sharma Kirana Store
      - key: MERCHANT_UPI_ID
        value: sharmakirana@paytm
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  # 2. Vite React Frontend (Static Site on Global CDN)
  - type: web
    name: voicevyapar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
